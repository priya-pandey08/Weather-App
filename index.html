<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEATHERLY</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">WEATHERLY</p>
        <h1>Current weather in any city</h1>
        <p class="hero-copy">Search by city and country to get temperature, humidity, wind speed, and conditions.</p>
      </div>
    </header>

    <main class="card">
      <form id="weather-form" class="weather-form" autocomplete="off">
        <div class="field-row">
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="Sydney" required>
        </div>

        <div class="field-row">
          <label for="country">Country</label>
          <input type="text" id="country" name="country" placeholder="AU or Australia" required>
        </div>

        <div class="field-row">
          <label for="api-key">OpenWeatherMap API Key</label>
          <input type="password" id="api-key" name="api-key" placeholder="Enter your API key">
        </div>

        <div class="actions">
          <button type="submit">Get Weather</button>
          <button type="button" id="save-key" class="secondary">Save API Key</button>
        </div>
      </form>

      <p class="hint">The API key stays in your browser and is not sent to a separate server.</p>
      <div id="message" class="message" aria-live="polite"></div>

      <section id="weather-result" class="weather-result hidden">
        <div class="weather-header">
          <div>
            <p class="result-label">Weather for</p>
            <h2 id="location-name"></h2>
            <p id="weather-description" class="weather-desc"></p>
          </div>
          <img id="weather-icon" src="" alt="Weather icon" aria-hidden="true">
        </div>

        <div class="weather-grid">
          <div class="detail-card">
            <span>Temperature</span>
            <strong id="temperature"></strong>
          </div>
          <div class="detail-card">
            <span>Humidity</span>
            <strong id="humidity"></strong>
          </div>
          <div class="detail-card">
            <span>Wind speed</span>
            <strong id="wind-speed"></strong>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
